name: Test Active Aero preflight retraining

on:
  schedule:
    # One-off test: Friday, July 3, 2026 at 11:30 PM EDT.
    # GitHub cron uses UTC, so this is Saturday, July 4, 2026 at 03:30 UTC.
    - cron: '30 3 4 7 *'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Run training even if preflight finds no new completed races"
        required: false
        type: boolean
        default: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for new Active Aero race data
        id: preflight
        continue-on-error: ${{ github.event.inputs.force_retrain == 'true' }}
        run: python scripts/check_active_aero_retrain_needed.py

      - name: Retrain Active Aero model
        if: ${{ github.event.inputs.force_retrain == 'true' || steps.preflight.outputs.should_retrain == 'true' }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x scripts/retrain_active_aero_weekly.sh
          ./scripts/retrain_active_aero_weekly.sh

      - name: Report retraining skip
        if: ${{ github.event.inputs.force_retrain != 'true' && steps.preflight.outputs.should_retrain != 'true' }}
        run: |
          echo "No Active Aero retraining required: ${{ steps.preflight.outputs.reason }}"
