name: Weekly Active Aero model retraining

on:
  schedule:
    # Primary attempt: Monday at 18:00 UTC (14:00 EDT / 13:00 EST).
    # Running later on Monday gives FastF1 additional time to publish the
    # completed race-session data while still allowing a prompt model update.
    - cron: '0 18 * * 1'

    # Fallback attempt: Wednesday at 12:00 UTC (08:00 EDT / 07:00 EST).
    # The preflight check skips retraining when Monday already succeeded.
    - cron: '0 12 * * 3'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Run training even if preflight finds no new completed races"
        required: false
        type: boolean
        default: false

concurrency:
  group: model-training-main
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore FastF1 cache
        id: fastf1-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            ~/.cache/fastf1
          key: fastf1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fastf1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate persistent training pipeline
        run: python -m unittest discover -s tests -v

      - name: Check for new Active Aero race data
        id: preflight
        continue-on-error: ${{ github.event.inputs.force_retrain == 'true' }}
        run: python scripts/check_active_aero_retrain_needed.py

      - name: Retrain Active Aero model
        if: ${{ github.event.inputs.force_retrain == 'true' || steps.preflight.outputs.should_retrain == 'true' }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          chmod +x scripts/retrain_active_aero_weekly.sh
          ./scripts/retrain_active_aero_weekly.sh

      - name: Report retraining skip
        if: ${{ github.event.inputs.force_retrain != 'true' && steps.preflight.outputs.should_retrain != 'true' }}
        run: |
          echo "No Active Aero retraining required: ${{ steps.preflight.outputs.reason }}"

      - name: Save updated FastF1 cache
        if: ${{ always() && (github.event.inputs.force_retrain == 'true' || steps.preflight.outputs.should_retrain == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            ~/.cache/fastf1
          key: fastf1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
