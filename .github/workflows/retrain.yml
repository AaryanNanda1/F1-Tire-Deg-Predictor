name: Weekly Model Retraining

on:
  schedule:
    # Run every Monday at 03:00 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training script
        run: |
          python train_era_models.py --mode both

      - name: Commit and push updated models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/
          # Commit changes only if the models actually changed
          git diff-index --quiet HEAD || (git commit -m "chore: automated weekly model retraining [skip ci]" && git push origin main)
