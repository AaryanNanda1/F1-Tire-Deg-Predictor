name: Render keepalive

on:
  schedule:
    # GitHub cron uses UTC. Render free web services sleep after inactivity,
    # so use the shortest supported cadence.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://f1-tire-deg-predictor.onrender.com/health' }}
    steps:
      - name: Ping Render health endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 240 \
            --retry 2 \
            --retry-delay 15 \
            --retry-all-errors \
            --retry-max-time 300 \
            "$HEALTH_URL"
