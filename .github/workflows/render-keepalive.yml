name: Render keepalive

on:
  schedule:
    # GitHub cron uses UTC. Render free web services sleep after inactivity,
    # so keep this below Render's idle window.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://f1-tire-deg-predictor.onrender.com/health' }}
    steps:
      - name: Ping Render health endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            "$HEALTH_URL"
