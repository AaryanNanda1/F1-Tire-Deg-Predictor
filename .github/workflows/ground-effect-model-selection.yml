name: Ground Effect model selection analysis

on:
  workflow_dispatch:

concurrency:
  group: ground-effect-model-selection
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-analysis.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-analysis.txt

      - name: Run Ground Effect model selection
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          LOKY_MAX_CPU_COUNT: "2"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p "$MPLCONFIGDIR"
          python -u analysis/run_final_model_selection.py \
            --output-dir reports/final_model_selection \
            --seed 42

      - name: Upload analysis package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ground-effect-model-selection-${{ github.run_id }}
          path: reports/final_model_selection/
          if-no-files-found: warn
          retention-days: 14
